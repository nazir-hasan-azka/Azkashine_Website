name: Deploy to Hostinger

# One repository, one site. A push to `main` builds and deploys www.azkashine.com.
# The `old` branch is the site that was live until 2026-09-07; it never deploys.
#
# There is no test site: test.azkashine.com was retired on 2026-09-10. Check a change
# on your machine before pushing - npm run check, npm test, npm run build.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A second push waits for the running deploy instead of racing it over FTP.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run from any other branch would put that branch on the live site.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm install`, not `npm ci`: developed on Windows, deployed on Linux, and npm on
      # Windows will not write the Linux-only optional dependencies (@emnapi/core and
      # @emnapi/runtime, via @tailwindcss/oxide-wasm32-wasi) that `npm ci` then demands.
      - name: Install dependencies
        run: npm install

      # NEXT_PUBLIC_SITE_ENV=production is what makes robots.txt say Allow. Every other
      # build - local, anybody's laptop - disallows. See app/robots.ts.
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: production

      # There is no backup-and-rollback step. The one this replaces never worked: the FTP
      # action only uploads, so its "backup" failed with ENOENT on every run. Rolling back
      # is `git revert <sha>` and a push.
      - name: Deploy to www.azkashine.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
