name: Build and Deploy to Hostinger

# WHEN does the robot wake up?
on:
  push:
    branches: [main]      # every time you push to the "main" branch
  workflow_dispatch: {}    # ...and a "Run" button you can click by hand in the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # the robot rents a fresh Linux computer for each run
    steps:
      # 1) Grab a copy of your code onto that fresh computer
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install Node.js (the engine that runs Next.js)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm        # remember downloaded packages between runs = faster

      # 3) Install the libraries listed in package-lock.json
      - name: Install dependencies
        # `npm install`, not `npm ci`, and deliberately so.
        #
        # This project is developed on Windows and deployed on Linux. `npm ci` refuses
        # to install when the lock file disagrees with package.json by even one entry,
        # and npm on Windows will not write the Linux-only optional dependencies that
        # the runner then demands — @emnapi/core and @emnapi/runtime, pulled in by
        # @tailwindcss/oxide-wasm32-wasi. Regenerating the lock file from scratch on
        # Windows does not add them; there is no Windows incantation that does.
        #
        # `npm install` still honours every pinned version in the lock file. It simply
        # resolves the handful of platform-specific extras the runner needs instead of
        # failing. The cost is a slightly slower install and a lock file that CI may
        # update in memory; the alternative is a deploy that cannot run at all.
        run: npm install

      # 4) Build the site into the out/ folder (our "plain files" from Step 1)
      - name: Build static site
        run: npm run build

      # 5) Copy everything in out/ onto Hostinger over FTP
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # These three come from GitHub's locked "Secrets" vault.
          # FTP_SERVER must be the hostname (ftp.azkashine.com), not a raw IP.
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Plain FTP (the action's default) — this is what the main azkashine.com
          # site uses and what Hostinger reliably accepts. FTPS handshakes were
          # flaking out, so we don't set protocol/port/timeout overrides here.
          # WHERE the built files come FROM (on the robot's computer):
          local-dir: ./out/
          # WHERE they go TO. The deploybot FTP account is locked ("chrooted")
          # to .../public_html, so from its point of view the subdomain folder
          # is simply "test/". (We deliberately keep the "test/" leaf so a deploy
          # can never write into the main site's root.)
          server-dir: test/
