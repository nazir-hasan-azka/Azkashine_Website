name: Deploy to Hostinger

# One repository, two sites. The branch decides everything:
#
#   main    -> www.azkashine.com   site root, robots.txt Allow
#   staging -> test.azkashine.com  test/ folder, robots.txt Disallow
#   old     -> never deploys; the site that was live until 2026-09-07
#
# Promote staging to production by merging `staging` into `main`.
on:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

# A second push to the same branch waits for the running deploy instead of racing it
# over FTP. Different branches deploy to different folders, so they may overlap.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The two sites use DIFFERENT FTP accounts. Production uses FTP_*, rooted at the
      # site root. Staging uses STAGING_FTP_*, the deploybot account chrooted to
      # public_html. Never let staging fall back to the production credentials: stop
      # here, before anything is built or uploaded, if its own are missing.
      - name: Check the staging FTP secrets exist
        if: github.ref_name == 'staging'
        env:
          S: ${{ secrets.STAGING_FTP_SERVER }}
          U: ${{ secrets.STAGING_FTP_USERNAME }}
          P: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::STAGING_FTP_SERVER, STAGING_FTP_USERNAME and STAGING_FTP_PASSWORD must all be set under Settings > Secrets and variables > Actions. Nothing was built or deployed."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm install`, not `npm ci`: developed on Windows, deployed on Linux, and npm on
      # Windows will not write the Linux-only optional dependencies (@emnapi/core and
      # @emnapi/runtime, via @tailwindcss/oxide-wasm32-wasi) that `npm ci` then demands.
      - name: Install dependencies
        run: npm install

      # NEXT_PUBLIC_SITE_ENV=production is what makes robots.txt say Allow, and it is
      # set for `main` and nothing else. See app/robots.ts.
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

      # There is no backup-and-rollback step. The one this replaces never worked: the FTP
      # action only uploads, so its "backup" failed with ENOENT on every run. Rolling back
      # is `git revert <sha>` and a push.
      - name: Deploy to www.azkashine.com
        if: github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /

      - name: Deploy to test.azkashine.com
        if: github.ref_name == 'staging'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./out/
          # The deploybot account sees public_html as its root, so the subdomain folder is
          # "test/". Keep the leaf: a staging deploy must never write into the site root.
          server-dir: test/
