name: Deploy to Hostinger (with rollback)

on:
  push:
    branches:
      - master   # change if your branch is "master"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      # THIS is what makes robots.txt say Allow. `app/robots.ts` disallows by default
      # so that staging, local builds and anybody's laptop can never invite Google in;
      # production is the one build that sets this. Remove it and the live site quietly
      # tells search engines to go away.
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: production

      - name: Backup current site (before deploy)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backup/
          server-dir: public_html/
          method: download   # 👈 grabs current live files into backup folder
        continue-on-error: true  # ignore if backup fails

      - name: Deploy new site
        id: deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /

      # The rollback deploys ./backup/ to the site root, and the backup step above is
      # `continue-on-error`. If the backup silently fails and the deploy then fails,
      # an unguarded rollback pushes an EMPTY directory at the root — and this action
      # deletes remote files absent from local-dir. That is a wipe, not a rollback.
      # `hashFiles` is empty when nothing matched, so this only runs with a real backup.
      - name: Rollback if deploy failed
        if: failure() && hashFiles('./backup/**') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backup/
          server-dir: /
